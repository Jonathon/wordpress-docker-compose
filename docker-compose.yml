services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordpress-oceanwp
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress_password}
      WORDPRESS_DEBUG: ${WP_DEBUG:-false}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_MEMORY_LIMIT', '256M' );
        define( 'WP_MAX_MEMORY_LIMIT', '512M' );
    volumes:
      - wordpress_data:/var/www/html
      - ./:/var/www/html/wp-content/themes/oceanwp-child-theme/:ro
      - ./plugins:/var/www/html/wp-content/plugins
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - oceanwp-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: wordpress-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-wordpress}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_USER: ${DB_USER:-wordpress}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordpress_password}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - oceanwp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: wordpress-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USER:-wordpress}
      PMA_PASSWORD: ${DB_PASSWORD:-wordpress_password}
      PMA_ABSOLUTE_URI: http://localhost:8081/
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - oceanwp-network
    restart: unless-stopped

volumes:
  wordpress_data:
    driver: local
  mysql_data:
    driver: local

networks:
  oceanwp-network:
    driver: bridge
